<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="WoodSilence 的个人博客，收录随笔、技术笔记和日常观察。">
  <title>WoodSilence · 个人博客</title>
  <link rel="stylesheet" href="blog.css">
</head>
<body>
  <header class="site-header measure">
    <a class="wordmark" href="./" aria-label="WoodSilence 博客首页" lang="en">WoodSilence<span aria-hidden="true">.</span></a>
    <nav aria-label="主导航">
      <a href="#writing">文章</a>
      <a href="#about">关于</a>
      <a href="https://github.com/woodsilence">GitHub</a>
    </nav>
  </header>

  <main class="measure">
    <section class="hero" aria-labelledby="home-title">
      <div class="hero-copy">
        <p class="eyebrow">个人博客</p>
        <h1 id="home-title">写作与日常</h1>
        <p class="intro">随笔、技术笔记，以及值得留存的日常。</p>
        <a class="button" href="#writing">浏览文章</a>
      </div>
      <img class="cover" src="assets/woodland.webp" width="1280" height="960" alt="晨雾中穿过林间的小路" fetchpriority="high">
    </section>

    <section class="writing" id="writing" aria-labelledby="writing-title">
      <h2 id="writing-title">文章</h2>
      <ol class="post-list">
        <li>
          <article class="post-row">
            <time datetime="2026-11-25">2026.11.25</time>
            <div>
              <h3><a href="posts/first-note.html">写在开始</a></h3>
              <p>关于这个博客，以及接下来会在这里写些什么。</p>
            </div>
          </article>
        </li>
      </ol>
    </section>

    <section class="about" id="about" aria-labelledby="about-title">
      <h2 id="about-title">关于</h2>
      <div>
        <p>这里是 WoodSilence 的个人博客，用来整理平时的想法、技术笔记和日常观察。</p>
        <a href="https://github.com/woodsilence">在 GitHub 找到 WoodSilence</a>
      </div>
    </section>
  </main>
  <footer class="site-footer measure">
    <span lang="en">WoodSilence</span>
  </footer>
</body>
</html>
